<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop Stock</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b7a38">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#eef3ec;--card:#fff;--ink:#16251a;--muted:#5d6f61;--line:#cfdacc;--green:#2b7a38;--on:#fff;--amber:#a85f00;--amberbg:#fff0d6;--red:#b3261e;--redbg:#fde3e0;--okbg:#e0f2e2;--blue:#1976d2;--bluebg:#e3f2fd}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a12;--card:#18271c;--ink:#e8f1ea;--muted:#9bb0a0;--line:#2c4231;--green:#5cc06c;--on:#0f1a12;--amber:#ffc15a;--amberbg:#3a2c0e;--red:#ff8c82;--redbg:#3d1916;--okbg:#17321c;--blue:#64b5f6;--bluebg:#0d263a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:660px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:26px;font-weight:800;margin:4px 0}
.who{color:var(--muted);font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.s{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.s b{display:block;font-size:19px;font-weight:800}.s span{font-size:13px;color:var(--muted)}
.s.bad{background:var(--redbg);border-color:var(--red)}.s.bad b{color:var(--red)}
.s.warn{background:var(--amberbg);border-color:var(--amber)}.s.warn b{color:var(--amber)}
.bar,.act{display:flex;gap:8px}.bar{margin-bottom:12px;flex-wrap:wrap}
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;width:100%}
.cat-tabs button{font-size:13px;padding:4px 10px;min-height:34px;white-space:nowrap;border-radius:20px}
.cat-tabs .on{background:var(--green);color:var(--on);border-color:var(--green)}
input,select,button{font:inherit;color:var(--ink)}
input,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
:focus-visible{outline:3px solid var(--green);outline-offset:1px}
button{cursor:pointer;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:8px 14px}
button.pri{background:var(--green);color:var(--on);border-color:var(--green);font-weight:700}
.item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--green);border-radius:10px;padding:12px;margin-bottom:10px}
.item.soon{border-left-color:var(--amber)}.item.exp{border-left-color:var(--red)}
.top{display:flex;justify-content:space-between;gap:8px}.nm{font-weight:700;font-size:17px}.sb{color:var(--muted);font-size:14px}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;font-weight:700;border-radius:20px;padding:2px 8px;height:fit-content;white-space:nowrap;background:var(--okbg);color:var(--green)}
.tag.cat{background:var(--bluebg);color:var(--blue)}
.soon .tag.exp-tag{background:var(--amberbg);color:var(--amber)}.exp .tag.exp-tag{background:var(--redbg);color:var(--red)}
.item-body{display:flex;gap:12px;margin-top:8px}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex-shrink:0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:14px;color:var(--muted);width:100%}
.g b{color:var(--ink);font-weight:600}.g .w{grid-column:1/-1}
.act button{flex:1;padding:6px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:24px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 2px 8px rgba(0,0,0,.3);border-radius:28px;padding:0 22px;min-height:52px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);width:min(460px,calc(100% - 24px));padding:16px;max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}label input,label select{margin-top:3px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tot{background:var(--okbg);color:var(--green);font-weight:700;border-radius:8px;padding:8px 10px;margin-bottom:10px}
.msg{min-height:20px;font-size:14px;color:var(--red);margin-top:6px}
.u{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.hide{display:none!important}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}.tabs .on{background:var(--green);color:var(--on);border-color:var(--green)}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--ink)}.chk input{width:22px;min-height:22px;margin-top:2px}
.lim{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.lim input{width:90px;min-height:36px;padding:4px 8px}
.img-preview{width:100%;height:100px;object-fit:cover;border-radius:8px;margin-top:6px;display:none}

.mini{display:inline-block;width:66px;min-height:30px;padding:2px 5px;margin:0 3px;text-align:center;font-size:13px}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.chart-head span,.chart-note{font-size:12px;color:var(--muted)}
.chart-total{font-size:22px;font-weight:800;margin:10px 0 2px}.chart-total small{font-size:12px;font-weight:500;color:var(--muted)}
#chart svg{display:block;width:100%;height:auto;max-height:150px;overflow:visible;margin-top:4px}
.chart-split{display:flex;height:10px;overflow:hidden;border-radius:8px;background:var(--line);margin-top:10px}
.chart-split span{background:var(--green)}.chart-split i{display:block;background:var(--amber)}
.chart-values,.chart-legend{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-top:6px}
.chart-legend{justify-content:flex-start;margin-top:10px}.chart-legend span{display:flex;align-items:center;gap:5px}
.chart-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}.cash-dot{background:var(--green)}.credit-dot{background:var(--amber)}
.chart-empty{padding:16px 4px;text-align:center;color:var(--muted);font-size:14px}
.item{animation:card-in .22s ease-out both}@keyframes card-in{from{opacity:.55;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<main>
  <h1>Shop stock</h1>
  <div id="auth" class="box">
    <div class="tabs"><button id="t1" class="on" type="button">Log in</button><button id="t2" type="button">New shop</button></div>
    <form id="lf">
      <label>Username<input id="lu" autocomplete="username" autocapitalize="none" required></label>
      <label>Password<input id="lp" type="password" autocomplete="current-password" required></label>
      <button class="pri" style="width:100%" type="submit">Log in</button>
    </form>
    <form id="sg" class="hide">
      <label>Shop name<input id="gn" required></label>
      <label>Choose a username<input id="gu" autocapitalize="none" required></label>
      <label>Password (6+ characters)<input id="gp" type="password" minlength="6" autocomplete="new-password" required></label>
      <button class="pri" style="width:100%" type="submit">Create shop</button>
    </form>
    <div class="msg" id="am" role="alert"></div>
  </div>
  <div id="in" class="hide">
    <div class="who"><span id="who"></span><button id="out" type="button">Log out</button></div>
    <div id="app" class="hide">
      <div class="sum" id="sum"></div>
      <section class="box hide" id="chartBox" aria-label="Sales dashboard">
        <div class="chart-head"><b>Sales overview</b><span id="chartRange">Last 14 days</span></div>
        <div id="chart"></div>
        <div class="chart-legend"><span><i class="cash-dot"></i> Cash</span><span><i class="credit-dot"></i> Credit</span></div>
        <p class="sb" id="chartNote">Sales history starts recording after this update.</p>
      </section>
      <div class="cat-tabs" id="catTabs">
        <button class="on" data-cat="all">All</button>
        <button data-cat="Insecticide">Insecticides</button>
        <button data-cat="Fungicide">Fungicides</button>
        <button data-cat="Acaricide">Acaricides</button>
        <button data-cat="Herbicide">Herbicides</button>
        <button data-cat="PGR">PGRs</button>
      </div>
      <div class="bar">
        <input id="q" type="search" placeholder="Search name, brand, lot or barcode..." aria-label="Search">
        <button id="scanBtn" type="button" style="min-width:44px;padding:0 10px" title="Scan Barcode">📷</button>
        <select id="f" aria-label="Filter" style="max-width:130px"><option value="all">All expiry</option><option value="exp">Expired</option><option value="soon">Expiring soon</option></select>
      </div>
      <div id="list"></div>
      <div class="box hide" id="staff">
        <b>Staff logins for your shop</b>
        <form id="sf" style="margin-top:10px">
          <div class="r2"><label>New username<input id="su" autocapitalize="none" required></label>
          <label>Password (6+ characters)<input id="sp" type="text" minlength="6" required></label></div>
          <label>Role<select id="sr"><option value="staff">Staff (cannot delete stock)</option><option value="admin">Admin (full access)</option></select></label>
          <button class="pri" type="submit">Create login</button>
        </form>
        <div id="ulist" style="margin-top:10px"></div>
        <b style="display:block;margin-top:14px">Recent activity</b><div id="log">No activity yet.</div>
        <div class="msg" id="sm" role="status"></div>
      </div>
    </div>
    <div id="owner" class="hide">
      <div class="sum" id="osum"></div>
      <input id="oq" type="search" placeholder="Search product, brand or shop" aria-label="Search" style="margin-bottom:12px">
      <div id="ogroups"></div>
    </div>
  </div>
</main>
<button class="pri fab hide" id="add" type="button">Add stock</button>
<dialog id="dlg"><form id="frm" method="dialog">
  <b id="dt" style="font-size:18px">Add stock</b>
  
  <label>Category
    <select id="cat" required>
      <option value="Insecticide">Insecticide (Pesticide)</option>
      <option value="Fungicide">Fungicide</option>
      <option value="Acaricide">Acaricide (Miticide)</option>
      <option value="Herbicide">Herbicide (Weedicide)</option>
      <option value="PGR">PGR / Biostimulant</option>
    </select>
  </label>
  <label>Common name
    <input id="common" list="preset-list" required placeholder="e.g. Coragen, Urea, Ulala">
  </label>
  <datalist id="preset-list">
    <option value="Chlorantraniliprole 18.5% SC (Coragen / Sholey)">
    <option value="Emamectin Benzoate 5% SG (Proclaim / War)">
    <option value="Flonicamid 50% WG (Ulala)">
    <option value="Imidacloprid 17.8% SL (Confidor)">
    <option value="Fipronil 5% SC / 80% WG (Regent / Jump)">
    <option value="Profenofos 40% + Cypermethrin 4% EC (Polytrin C)">
    <option value="Thiamethoxam 25% WG (Actara)">
    <option value="Chlorpyrifos 50% + Cypermethrin 5% EC (505)">
    <option value="Spinetoram 11.7% SC (Delegate)">
    <option value="Broflanilide 20% SC (Exponus)">
    <option value="Diafenthiuron 50% WP (Pegasus)">
    <option value="Dinotefuran 20% SG (Osheen)">
    <option value="Azoxystrobin 18.2% + Difenoconazole 11.4% SC (Amistar Top)">
    <option value="Tebuconazole 50% + Trifloxystrobin 25% WG (Nativo)">
    <option value="Carbendazim 12% + Mancozeb 63% WP (Saaf)">
    <option value="Hexaconazole 5% EC (Contaf)">
    <option value="Validamycin 3% L (Sheathmar)">
    <option value="Thiophanate Methyl 70% WP (Roko)">
    <option value="Fenpyroximate 5% EC (Pyrote)">
    <option value="Spiromesifen 22.9% SC (Oberon)">
    <option value="Propargite 57% EC (Omite)">
    <option value="Bispyribac Sodium 10% SC (Nominee Gold)">
    <option value="Pendimethalin 30% EC / 38.7% CS (Stomp / Panda)">
    <option value="Glyphosate 41% SL (Roundup / Glycel)">
    <option value="Quizalofop-Ethyl 5% EC (Targa Super)">
    <option value="Atrazine 50% WP (Atratrap)">
    <option value="Pretilachlor 50% EC (Rifit)">
    <option value="Glufosinate Ammonium 13.5% SL (Basta)">

    <option value="Broflanilide 20% SC (Exponus)">
    <option value="Azoxystrobin 18.2% + Difenoconazole 11.4% SC (Amistar Top)">
    <option value="Profenofos 40% + Cypermethrin 4% EC (Polytrin C)">
    <option value="Chlorpyrifos 50% + Cypermethrin 5% EC (505)">
    <option value="Fipronil 80% WG (Jump)">
    <option value="Pendimethalin 38.7% CS (Panda)">
    <option value="Iprobenfos 48% EC">
    <option value="Azoxystrobin 7.5% + Tebuconazole 12% + Isoprothiolane 12% SE">
    <option value="Carbendazim 12% + Mancozeb 63% WP (Saaf)">
    <option value="Trifloxystrobin + Tebuconazole (Nativo)">
    <option value="Glyphosate 41% SL (Roundup / Glycel)">
    <option value="Quizalofop-Ethyl 5% EC (Targa Super)">
    <option value="Atrazine 50% WP (Atratrap)">
    <option value="Pretilachlor 50% EC (Rifit)">
    <option value="Glufosinate Ammonium 13.5% SL (Basta)">
  </datalist>
  <label>Technical name<input id="tech" list="tech-list" placeholder="e.g. Chlorantraniliprole"></label>
  <datalist id="tech-list">
    <option value="Chlorantraniliprole"><option value="Emamectin benzoate"><option value="Flonicamid">
    <option value="Imidacloprid"><option value="Fipronil"><option value="Thiamethoxam">
    <option value="Spinetoram"><option value="Diafenthiuron"><option value="Dinotefuran">
    <option value="Hexaconazole"><option value="Validamycin"><option value="Thiophanate methyl">
    <option value="Fenpyroximate"><option value="Spiromesifen"><option value="Propargite">
    <option value="Bispyribac-sodium"><option value="Pendimethalin"><option value="Glyphosate">
    <option value="Quizalofop-ethyl"><option value="Atrazine"><option value="Pretilachlor">
    <option value="Glufosinate ammonium"><option value="Azoxystrobin + Difenoconazole">
    <option value="Profenofos + Cypermethrin"><option value="Chlorpyrifos + Cypermethrin">
  </datalist>
  <label>Brand / Company<input id="brand" list="brand-list" placeholder="e.g. Coragen, Syngenta, Bayer"></label>
  <datalist id="brand-list">
    <option value="Coragen"><option value="Sholey"><option value="Proclaim"><option value="War">
    <option value="Ulala"><option value="Confidor"><option value="Regent"><option value="Jump">
    <option value="Actara"><option value="Delegate"><option value="Pegasus"><option value="Osheen">
    <option value="Contaf"><option value="Sheathmar"><option value="Roko"><option value="Pyrote">
    <option value="Oberon"><option value="Omite"><option value="Nominee Gold"><option value="Stomp">
    <option value="Panda"><option value="Roundup"><option value="Glycel"><option value="Targa Super">
    <option value="Atratrap"><option value="Rifit"><option value="Basta"><option value="Saaf">
    <option value="Amistar Top"><option value="Polytrin C"><option value="Nativo"><option value="Exponus">
  </datalist>
  
  <div class="r2">
    <label>Lot / Batch no.<input id="lot" required></label>
    <label>Barcode no. <button type="button" id="formScanBtn" style="font-size:12px;padding:2px 6px;min-height:24px">📷 Scan</button><input id="barcode" placeholder="Optional"></label>
    <label>Supplier<input id="sup"></label>
    <label>Date of purchase<input id="bought" type="date" required></label>
    <label>Expiry date<input id="exp" type="date" required></label>
    <label>Pack size<input id="ps" type="number" min="0" step="any" required></label>
    <label>Pack unit
      <select id="pu">
        <option value="L">Litre (L)</option>
        <option value="ml">Millilitre (ml)</option>
        <option value="kg">Kilogram (kg)</option>
        <option value="g">Gram (g)</option>
      </select>
    </label>
    <label>Number of packs<input id="packs" type="number" min="0" step="any" required></label><span></span>
    <label>Cost per pack<input id="cost" type="number" min="0" step="any" required></label>
    <label>Selling price per pack<input id="sell" type="number" min="0" step="any" required></label>
  </div>
  <label>Product Photo (Optional)
    <input type="file" id="photoInput" accept="image/*">
    <img id="photoPreview" class="img-preview" alt="Product preview">
  </label>
  <div class="tot" id="ftot"></div>
  <div class="act"><button type="button" id="cx">Cancel</button><button class="pri" type="submit">Save</button></div>
</form></dialog>
<dialog id="sdlg"><form id="sfrm" method="dialog">
  <b id="st" style="font-size:18px">Sell</b>
  <label>Payment Mode
    <select id="paymode" required>
      <option value="Cash">Cash Sale</option>
      <option value="Credit">Credit Sale (Udhar)</option>
    </select>
  </label>
  <label>Packs sold<input id="sq" type="number" min="0" step="any" required></label>
  <label>Farmer Name (Optional)<input id="cname" placeholder="e.g. Ramesh"></label>
  <label>Farmer WhatsApp Mobile (Optional)<input id="cphone" type="tel" placeholder="e.g. 9876543210"></label>
  <div class="tot" id="stot" style="margin-top:8px"></div>
  <div class="act">
    <button type="button" id="scx">Cancel</button>
    <button class="pri" type="submit">Reduce stock</button>
  </div>
</form></dialog>
<dialog id="scandlg">
  <b style="font-size:18px">Scan Barcode</b>
  <div style="margin:12px 0;text-align:center">
    <video id="scanVideo" style="width:100%;max-height:260px;background:#000;border-radius:8px" autoplay playsinline></video>
    <p id="scanStatus" style="font-size:13px;color:var(--muted)">Point camera at barcode...</p>
  </div>
  <div class="act"><button type="button" id="closeScan">Close Scanner</button></div>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,addDoc,query,orderBy,limit,where,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=i=>document.getElementById(i);
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const mail=u=>u.trim().toLowerCase().replace(/[^a-z0-9._-]/g,"")+"@shopstock.app";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let me=null,items=[],costs={},users=[],unsubs=[],editId=null,sellId=null,delArm=null,secAuth=null,signingUp=false,shops={},ostock={},limits={},subbed={};
let selectedCategory="all",photoBase64="",salesRows=[];
let pref={cur:"₹",warn:60};try{Object.assign(pref,JSON.parse(localStorage.getItem("ss-pref")))}catch(e){}
const money=n=>pref.cur+(Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
const num=n=>(Math.round(n*1000)/1000).toLocaleString(undefined,{maximumFractionDigits:3});
const days=v=>{if(!v)return 999;const p=v.split("-"),d=new Date(p[0],p[1]-1,p[2]),t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)};
const fmt=v=>{if(!v)return"–";const p=v.split("-");return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})};
const st=it=>{const d=days(it.exp);return d<0?"exp":d<=pref.warn?"soon":"ok"};
const lab=it=>{const d=days(it.exp);return d<0?`Expired ${-d}d ago`:d===0?"Expires today":`${d} days left`};
const F={L:1,ml:.001,kg:1,g:.001},base=u=>u==="L"||u==="ml"?"L":"kg",total=it=>(it.packs||0)*(it.ps||0)*(F[it.pu]||1);
const cost=it=>costs[it.id]||0;
const addLog=t=>{try{addDoc(collection(db,"shops",me.shopId,"log"),{by:me.username,at:Date.now(),text:t})}catch(e){}};
const localDay=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function renderChart(){
  const box=$("chartBox"),host=$("chart");if(!box||!host)return;
  const rows=salesRows.filter(x=>!x.cancelled),daysMap={};let cash=0,credit=0,total=0;
  rows.forEach(x=>{const amount=Number(x.total)||0;daysMap[x.day||new Date(x.at||Date.now()).toISOString().slice(0,10)]=(daysMap[x.day||new Date(x.at||Date.now()).toISOString().slice(0,10)]||0)+amount;total+=amount;if(x.mode==="Credit")credit+=amount;else cash+=amount});
  const keys=Object.keys(daysMap).sort().slice(-14);
  if(!rows.length){box.classList.remove("hide");host.innerHTML='<div class="chart-empty">No sales recorded yet. New sales will appear here automatically.</div>';$("chartNote").textContent="Only sales made after this update are included; older sales are not reconstructed.";return}
  box.classList.remove("hide");const max=Math.max(1,...keys.map(k=>daysMap[k]));const W=320,H=132,bw=W/Math.max(1,keys.length);
  const bars=keys.map((k,i)=>{const h=Math.max(3,daysMap[k]/max*88);return `<rect x="${i*bw+bw*.16}" y="${100-h}" width="${bw*.68}" height="${h}" rx="4" fill="var(--green)"/><text x="${i*bw+bw/2}" y="119" text-anchor="middle" font-size="9" fill="currentColor">${k.slice(5)}</text>`}).join("");
  host.innerHTML=`<div class="chart-total">${money(total)} <small>recorded sales</small></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily sales for the last 14 days">${bars}</svg><div class="chart-split"><span style="width:${total?cash/total*100:0}%"></span><i style="width:${total?credit/total*100:0}%"></i></div><div class="chart-values"><span>Cash ${money(cash)}</span><span>Credit ${money(credit)}</span></div>`;
  $("chartNote").textContent=`${rows.length} recorded sale${rows.length===1?"":"s"} · last 14 active days shown`;
}
$("sum").addEventListener("change",e=>{if(e.target.id!=="warnIn")return;pref.warn=Math.max(1,Math.min(365,parseInt(e.target.value,10)||60));try{localStorage.setItem("ss-pref",JSON.stringify(pref))}catch(x){}render()});
$("catTabs").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  Array.from($("catTabs").children).forEach(c=>c.classList.remove("on"));
  b.classList.add("on");selectedCategory=b.dataset.cat;render();
};
function render(){
  let c=0,sell=0,soon=0,exp=0,loss=0,L=0,kg=0;
  items.forEach(it=>{const s=st(it);
    if(s==="exp"){exp++;loss+=(it.packs||0)*cost(it)}else{c+=(it.packs||0)*cost(it);sell+=(it.packs||0)*(it.sell||0);base(it.pu)==="L"?L+=total(it):kg+=total(it)}
    if(s==="soon")soon++});
  $("sum").innerHTML=`<div class="s"><b>${money(c)}</b><span>Stock value (cost)</span></div><div class="s"><b>${money(sell-c)}</b><span>Expected profit</span></div>
  <div class="s"><b>${num(L)} L</b><span>Liquid in stock</span></div><div class="s"><b>${num(kg)} kg</b><span>Solid in stock</span></div>
  <div class="s ${soon?"warn":""}"><b>${soon}</b><span>Expiring within <input id="warnIn" class="mini" type="number" min="1" max="365" value="${pref.warn}" aria-label="Expiry warning days"> days</span></div><div class="s ${exp?"bad":""}"><b>${exp?money(loss):0}</b><span>Expired loss (${exp} lots)</span></div>`;
  
  renderChart();
  const q=$("q").value.trim().toLowerCase(),f=$("f").value,adm=me&&me.role==="admin";
  const rows=items.filter(it=>{
    const matchCat=selectedCategory==="all"||(it.cat||"Insecticide")===selectedCategory;
    const matchQ=!q||[it.common,it.tech,it.brand,it.lot,it.barcode,it.cat].join(" ").toLowerCase().includes(q);
    const matchF=f==="all"||st(it)===f;
    return matchCat && matchQ && matchF;
  }).sort((a,b)=>a.exp<b.exp?-1:a.exp>b.exp?1:0);
  $("list").innerHTML=rows.length?rows.map(it=>`<div class="item ${st(it)}" data-id="${it.id}">
    <div class="top">
      <div>
        <div class="nm">${esc(it.common||"Unnamed")}</div>
        <div class="sb">${[it.tech,it.brand].filter(Boolean).map(esc).join(" · ")||"No technical or brand name"}</div>
      </div>
      <div class="tags">
        <span class="tag cat">${esc(it.cat||"Insecticide")}</span>
        <span class="tag exp-tag">${lab(it)}</span>
      </div>
    </div>
    <div class="item-body">
      ${it.photo?`<img class="thumb" src="${it.photo}" alt="Product">`:""}
      <div class="g">
        <span>Lot <b>${esc(it.lot||"–")}</b> ${it.barcode?`· Barcode <b>${esc(it.barcode)}</b>`:""}</span>
        <span>Expiry <b>${fmt(it.exp)}</b></span>
        <span>Bought <b>${fmt(it.bought)}</b></span>
        <span>Supplier <b>${esc(it.sup||"–")}</b></span>
        <span class="w">Packing <b>${num(it.ps||0)} ${esc(it.pu||"L")} × ${num(it.packs||0)} packs = ${num(total(it))} ${base(it.pu||"L")}</b></span>
        <span>Cost / pack <b>${money(cost(it))}</b></span>
        <span>Selling / pack <b>${money(it.sell||0)}</b></span>
      </div>
    </div>
    <div class="act" style="margin-top:10px">
      <button data-a="sell" type="button">Sell</button>
      <button data-a="edit" type="button">Edit</button>
      ${adm?`<button data-a="del" type="button">${delArm===it.id?"Tap again to delete":"Delete"}</button>`:""}
    </div>
  </div>`).join(""):`<div class="empty">${items.length?"No lots match search/category.":"No stock yet. Tap “Add stock” to enter your first lot."}</div>`;
}
function renderUsers(){$("ulist").innerHTML=users.map(u=>`<div class="u"><span>${esc(u.username)} · ${u.role}${u.active?"":" · disabled"}</span>${u.id===me.uid?"":`<button data-u="${u.id}" data-on="${u.active?0:1}" type="button">${u.active?"Disable":"Enable"}</button>`}</div>`).join("")}
const ppu=r=>(r.sell||0)/(((r.ps||1)*(F[r.pu]||1))||1),lim=k=>limits[k]&&limits[k].max;
function renderOwner(){
  const q=$("oq").value.trim().toLowerCase(),g={};let lots=0,expd=0;
  Object.keys(ostock).forEach(sid=>(ostock[sid]||[]).forEach(it=>{
    lots++;
    if(st(it)==="exp")expd++;
    const k=String(it.common||"unnamed").trim().toLowerCase();
    (g[k]=g[k]||[]).push({...it,shop:(shops[sid]||{}).name||sid});
  }));
  const over=k=>(g[k]||[]).filter(r=>lim(k)&&ppu(r)>lim(k)).length;
  const keys=Object.keys(g).filter(k=>!q||k.includes(q)||g[k].some(r=>(String(r.shop||"")+" "+String(r.brand||"")).toLowerCase().includes(q))).sort((a,b)=>over(b)-over(a)||a.localeCompare(b));
  const flagged=Object.keys(g).reduce((a,k)=>a+over(k),0);
  $("osum").innerHTML=`<div class="s"><b>${Object.keys(shops).length}</b><span>Shops</span></div><div class="s"><b>${lots}</b><span>Stock lots</span></div><div class="s ${flagged?"bad":""}"><b>${flagged}</b><span>Prices above limit</span></div><div class="s ${expd?"warn":""}"><b>${expd}</b><span>Expired lots</span></div>`;
  $("ogroups").innerHTML=keys.length?keys.map(k=>{const rs=g[k].slice().sort((a,b)=>ppu(b)-ppu(a)),n=over(k);
    return`<div class="item ${n?"exp":""}"><div class="top"><div class="nm">${esc(rs[0].common||"Unnamed")}</div><label class="lim" style="margin:0">Max per ${base(rs[0].pu||"L")}<input data-k="${esc(k)}" type="number" min="0" step="any" value="${lim(k)||""}" aria-label="Maximum price per unit"></label></div>`+
    rs.map(r=>`<div class="u" style="display:block"><b>${esc(r.shop)}</b> · ${esc(r.brand||"–")} · lot ${esc(r.lot||"–")}<br><span class="sb">${money(r.sell||0)} per ${num(r.ps||0)} ${esc(r.pu||"L")} pack · ${money(ppu(r))} per ${base(r.pu||"L")}${lim(k)&&ppu(r)>lim(k)?" · above limit":""}</span></div>`).join("")+`</div>`}).join(""):`<div class="empty">No stock from any shop yet.</div>`;
}
$("oq").oninput=renderOwner;
$("ogroups").onchange=async e=>{const i=e.target.closest("input[data-k]");if(!i)return;const k=i.dataset.k;
  try{i.value===""?await deleteDoc(doc(db,"limits",k)):await setDoc(doc(db,"limits",k),{max:+i.value||0})}catch(x){alert("Couldn’t save limit: "+x.message)}};
function startOwner(){
  unsubs.push(onSnapshot(collection(db,"limits"),s=>{limits={};s.docs.forEach(d=>limits[d.id]=d.data());renderOwner()}));
  unsubs.push(onSnapshot(collection(db,"shops"),s=>{s.docs.forEach(d=>{shops[d.id]=d.data();
    if(!subbed[d.id]){subbed[d.id]=1;unsubs.push(onSnapshot(collection(db,"shops",d.id,"stock"),ss=>{ostock[d.id]=ss.docs.map(x=>({...x.data(),id:x.id}));renderOwner()},err=>console.log(err)))}});renderOwner()}));
}
const ftot=()=>{$("ftot").textContent="Total quantity: "+num((+$("ps").value||0)*(+$("packs").value||0)*(F[$("pu").value]||1))+" "+base($("pu").value)};
["ps","packs","pu"].forEach(i=>$(i).addEventListener("input",ftot));
$("photoInput").onchange=e=>{
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=evt=>{
    photoBase64=evt.target.result;
    $("photoPreview").src=photoBase64;
    $("photoPreview").style.display="block";
  };
  reader.readAsDataURL(file);
};
const FIELDS=["cat","common","tech","brand","lot","barcode","sup","bought","exp","ps","packs","sell"];
function openForm(it){
  editId=it?it.id:null;$("dt").textContent=it?"Edit stock":"Add stock";
  FIELDS.concat("cost").forEach(k=>$(k).value="");
  photoBase64=it&&it.photo?it.photo:"";
  if(photoBase64){$("photoPreview").src=photoBase64;$("photoPreview").style.display="block"}
  else{$("photoPreview").style.display="none"}
  if(it){FIELDS.forEach(k=>$(k).value=it[k]!=null?it[k]:"");$("cost").value=cost(it)}
  else{$("cat").value="Insecticide";$("pu").value="L";$("bought").value=new Date().toISOString().slice(0,10)}
  ftot();$("dlg").showModal();
}
$("add").onclick=()=>openForm(null);$("cx").onclick=()=>$("dlg").close();$("scx").onclick=()=>$("sdlg").close();
$("frm").onsubmit=async()=>{
  const o={};FIELDS.forEach(k=>o[k]=$(k).value.trim());["ps","packs","sell"].forEach(k=>o[k]=parseFloat(o[k])||0);
  o.pu=$("pu").value;o.photo=photoBase64;
  const id=editId||nid(),sid=me.shopId;
  try{await setDoc(doc(db,"shops",sid,"stock",id),o);await setDoc(doc(db,"shops",sid,"private",id),{cost:parseFloat($("cost").value)||0});addLog((editId?"edited ":"added ")+o.common+" (lot "+o.lot+")")}catch(e){alert("Couldn’t save: "+e.message)}
};
const updateStot=()=>{
  const it=items.find(x=>x.id===sellId);if(!it)return;
  const q=+$("sq").value||0;
  $("stot").textContent=`Total Bill: ${money(q*it.sell)} (${$("paymode").value})`;
};
$("sq").oninput=updateStot;
$("paymode").onchange=updateStot;
$("sfrm").onsubmit=async e=>{
  e.preventDefault();
  const it=items.find(x=>x.id===sellId);if(!it)return;
  const n=+$("sq").value||0,mode=$("paymode").value,cname=$("cname").value.trim(),cphone=$("cphone").value.trim();
  if(!(n>0)||n>Number(it.packs||0)){alert("Enter a quantity greater than zero and no more than the available packs.");return}
  const at=Date.now(),totalAmount=n*(Number(it.sell)||0),saleRef=doc(collection(db,"shops",me.shopId,"sales")),batch=writeBatch(db);
  try{
    batch.update(doc(db,"shops",me.shopId,"stock",sellId),{packs:Math.max(0,Math.round((it.packs-n)*1000)/1000)});
    batch.set(saleRef,{at,day:localDay(),packs:n,price:Number(it.sell)||0,total:totalAmount,mode,product:it.common||"",lot:it.lot||"",by:me.username,customer:cname||""});
    await batch.commit();$("sdlg").close();
    const logTxt=`sold ${num(n)} packs of ${it.common} (lot ${it.lot}) - ${mode}${cname?' to '+cname:''}`;addLog(logTxt);
    if(cphone){const billMsg=`*SHOP RECEIPT*\nItem: ${it.common}\nLot: ${it.lot}\nPacks: ${n}\nTotal: ${money(totalAmount)}\nPayment: ${mode}\nThank you!`;window.open(`https://wa.me/91${cphone.replace(/\D/g,'')}?text=${encodeURIComponent(billMsg)}`,'_blank')}
  }catch(e){alert("Couldn’t save sale: "+e.message)}
};
$("list").onclick=async e=>{const b=e.target.closest("button");if(!b)return;
  const id=b.closest(".item").dataset.id,it=items.find(x=>x.id===id);
  if(b.dataset.a==="edit")openForm(it);
  else if(b.dataset.a==="sell"){
    sellId=id;$("st").textContent=`Sell: ${it.common} (Lot ${it.lot})`;
    $("sq").value="";$("sq").max=it.packs;$("cname").value="";$("cphone").value="";
    updateStot();$("sdlg").showModal();
  }
  else if(b.dataset.a==="del"){if(delArm===id){delArm=null;try{await deleteDoc(doc(db,"shops",me.shopId,"stock",id));await deleteDoc(doc(db,"shops",me.shopId,"private",id));addLog("deleted "+it.common+" (lot "+it.lot+")")}catch(x){alert("Couldn’t delete: "+x.message)}}else{delArm=id;render()}}
};
$("q").oninput=render;$("f").onchange=render;
let scanTargetInput=null,streamTrack=null,scanTimer=null,scanStream=null;
async function startScan(targetInput){
  scanTargetInput=targetInput;$("scandlg").showModal();$("scanStatus").textContent="Starting camera…";
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("Camera access is not available in this app context.");
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
    const video=$("scanVideo");video.srcObject=scanStream;streamTrack=scanStream.getVideoTracks()[0];await video.play();
    const detector=("BarcodeDetector" in window)?new BarcodeDetector({formats:["code_128","ean_13","ean_8","qr_code","upc_a","data_matrix"]}):null;
    const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});
    if(!detector&&!window.jsQR){$("scanStatus").textContent="Scanner library unavailable. Close and enter the code manually.";return}
    $("scanStatus").textContent="Point the rear camera at a QR code or barcode.";
    scanTimer=setInterval(async()=>{try{let value="";if(detector){const found=await detector.detect(video);if(found.length)value=found[0].rawValue}else if(video.videoWidth){canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0);const found=window.jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height);if(found)value=found.data}if(value){const target=scanTargetInput;target.value=value;if(target===$("q"))render();stopScan()}}catch(e){}},350);
  }catch(e){stopScan();alert("Camera access failed: "+e.message)}
}
function stopScan(){if(scanTimer){clearInterval(scanTimer);scanTimer=null}if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;streamTrack=null}try{$("scanVideo").srcObject=null;if($("scandlg").open)$("scandlg").close()}catch(e){}}

$("scanBtn").onclick=()=>startScan($("q"));
$("formScanBtn").onclick=()=>startScan($("barcode"));
$("closeScan").onclick=stopScan;
$("t1").onclick=()=>{$("lf").classList.remove("hide");$("sg").classList.add("hide");$("t1").classList.add("on");$("t2").classList.remove("on");$("am").textContent=""};
$("t2").onclick=()=>{$("sg").classList.remove("hide");$("lf").classList.add("hide");$("t2").classList.add("on");$("t1").classList.remove("on");$("am").textContent=""};
$("lf").onsubmit=async e=>{e.preventDefault();$("am").textContent="";
  try{await signInWithEmailAndPassword(auth,mail($("lu").value),$("lp").value)}catch(x){$("am").textContent="Wrong username or password, or no internet connection."}};
$("sg").onsubmit=async e=>{e.preventDefault();$("am").textContent="";signingUp=true;
  try{const u=$("gu").value.trim().toLowerCase(),sid=nid();
    const c=await createUserWithEmailAndPassword(auth,mail(u),$("gp").value);
    await setDoc(doc(db,"shops",sid),{name:$("gn").value.trim(),ownerUid:c.user.uid,createdAt:Date.now()});
    await setDoc(doc(db,"users",c.user.uid),{username:u,role:"admin",shopId:sid,active:true});
    signingUp=false;await boot(auth.currentUser);
  }catch(x){signingUp=false;$("am").textContent=x.code==="auth/email-already-in-use"?"That username is taken. Try another.":"Couldn’t create the shop: "+x.message}};
$("out").onclick=()=>signOut(auth);
$("sf").onsubmit=async e=>{e.preventDefault();const u=$("su").value.trim().toLowerCase();$("sm").textContent="";
  try{
    if(!secAuth){
      const apps=window.firebaseApps||[];
      secAuth=getAuth(apps.find(a=>a.name==="secondary")||initializeApp(firebaseConfig,"secondary"));
    }
    const c=await createUserWithEmailAndPassword(secAuth,mail(u),$("sp").value);await signOut(secAuth);
    await setDoc(doc(db,"users",c.user.uid),{username:u,role:$("sr").value,shopId:me.shopId,active:true});
    $("sf").reset();$("sm").style.color="var(--green)";$("sm").textContent="Login created for "+u+".";
  }catch(x){$("sm").style.color="var(--red)";$("sm").textContent=x.code==="auth/email-already-in-use"?"That username is taken.":"Couldn’t create login: "+x.message}};
$("ulist").onclick=async e=>{const b=e.target.closest("button");if(!b)return;
  try{await updateDoc(doc(db,"users",b.dataset.u),{active:b.dataset.on==="1"})}catch(x){alert(x.message)}};
async function boot(u){
  unsubs.forEach(f=>f());unsubs=[];me=null;items=[];salesRows=[];costs={};shops={};ostock={};subbed={};
  if(!u){$("in").classList.add("hide");$("auth").classList.remove("hide");$("add").classList.add("hide");return}
  let p=null;try{const s=await getDoc(doc(db,"users",u.uid));p=s.exists()?s.data():null}catch(e){}
  if(!p||!p.active){await signOut(auth);$("am").textContent="This login is disabled or not set up. Ask your shop admin.";return}
  me={...p,uid:u.uid};$("auth").classList.add("hide");$("in").classList.remove("hide");
  $("who").textContent=`Logged in as ${p.username} (${p.role==="owner"?"app owner":p.role})`;
  if(p.role==="owner"){$("app").classList.add("hide");$("add").classList.add("hide");$("owner").classList.remove("hide");startOwner();return}
  $("owner").classList.add("hide");$("app").classList.remove("hide");$("add").classList.remove("hide");
  const sid=p.shopId,adm=p.role==="admin";$("staff").classList.toggle("hide",!adm);
  try{const s=await getDoc(doc(db,"shops",sid));if(s.exists())$("who").textContent+=" · "+s.data().name}catch(e){}
  unsubs.push(onSnapshot(collection(db,"shops",sid,"stock"),s=>{items=s.docs.map(d=>({...d.data(),id:d.id}));render()},e=>alert("Cloud error: "+e.message)));
  unsubs.push(onSnapshot(query(collection(db,"shops",sid,"sales"),orderBy("at","desc"),limit(500)),s=>{salesRows=s.docs.map(d=>({...d.data(),id:d.id}));renderChart()},e=>{console.warn("Sales history unavailable:",e.message);$("chartNote").textContent="Sales history could not be loaded. Check Firestore permissions."}));
  unsubs.push(onSnapshot(collection(db,"shops",sid,"private"),s=>{costs={};s.docs.forEach(d=>costs[d.id]=d.data().cost||0);render()}));
  if(adm){
    unsubs.push(onSnapshot(query(collection(db,"users"),where("shopId","==",sid)),s=>{users=s.docs.map(d=>({...d.data(),id:d.id}));renderUsers()}));
    unsubs.push(onSnapshot(query(collection(db,"shops",sid,"log"),orderBy("at","desc"),limit(30)),s=>{$("log").innerHTML=s.docs.length?s.docs.map(d=>{const l=d.data();return`<div class="u"><span>${esc(l.by)} ${esc(l.text)}</span><span style="color:var(--muted);font-size:13px">${new Date(l.at).toLocaleString(undefined,{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}</span></div>`}).join(""):"No activity yet."}));
  }
  render();
}
onAuthStateChanged(auth,u=>{if(!signingUp)boot(u)});
</script>

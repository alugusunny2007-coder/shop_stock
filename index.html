<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop Stock</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b7a38">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#eef3ec;--card:#fff;--ink:#16251a;--muted:#5d6f61;--line:#cfdacc;--green:#2b7a38;--on:#fff;--amber:#a85f00;--amberbg:#fff0d6;--red:#b3261e;--redbg:#fde3e0;--okbg:#e0f2e2}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a12;--card:#18271c;--ink:#e8f1ea;--muted:#9bb0a0;--line:#2c4231;--green:#5cc06c;--on:#0f1a12;--amber:#ffc15a;--amberbg:#3a2c0e;--red:#ff8c82;--redbg:#3d1916;--okbg:#17321c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:660px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:26px;font-weight:800;margin:4px 0}
.who{color:var(--muted);font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.s{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.s b{display:block;font-size:19px;font-weight:800}.s span{font-size:13px;color:var(--muted)}
.s.bad{background:var(--redbg);border-color:var(--red)}.s.bad b{color:var(--red)}
.s.warn{background:var(--amberbg);border-color:var(--amber)}.s.warn b{color:var(--amber)}
.bar,.act{display:flex;gap:8px}.bar{margin-bottom:12px}
input,select,button{font:inherit;color:var(--ink)}
input,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
:focus-visible{outline:3px solid var(--green);outline-offset:1px}
button{cursor:pointer;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:8px 14px}
button.pri{background:var(--green);color:var(--on);border-color:var(--green);font-weight:700}
.item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--green);border-radius:10px;padding:12px;margin-bottom:10px}
.item.soon{border-left-color:var(--amber)}.item.exp{border-left-color:var(--red)}
.top{display:flex;justify-content:space-between;gap:8px}.nm{font-weight:700;font-size:17px}.sb{color:var(--muted);font-size:14px}
.tag{font-size:13px;font-weight:700;border-radius:20px;padding:2px 10px;height:fit-content;white-space:nowrap;background:var(--okbg);color:var(--green)}
.soon .tag{background:var(--amberbg);color:var(--amber)}.exp .tag{background:var(--redbg);color:var(--red)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin:8px 0;font-size:14px;color:var(--muted)}
.g b{color:var(--ink);font-weight:600}.g .w{grid-column:1/-1}
.act button{flex:1;padding:6px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:24px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 2px 8px rgba(0,0,0,.3);border-radius:28px;padding:0 22px;min-height:52px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);width:min(460px,calc(100% - 24px));padding:16px;max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}label input,label select{margin-top:3px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tot{background:var(--okbg);color:var(--green);font-weight:700;border-radius:8px;padding:8px 10px;margin-bottom:10px}
.msg{min-height:20px;font-size:14px;color:var(--red);margin-top:6px}
.u{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.hide{display:none!important}
.note{color:var(--muted);font-size:13px;margin-top:20px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}.tabs .on{background:var(--green);color:var(--on);border-color:var(--green)}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--ink)}.chk input{width:22px;min-height:22px;margin-top:2px}
.lim{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.lim input{width:90px;min-height:36px;padding:4px 8px}
</style>
</head>
<body>
<main>
  <h1>Shop stock</h1>
  <div id="auth" class="box">
    <div class="tabs"><button id="t1" class="on" type="button">Log in</button><button id="t2" type="button">New shop</button></div>
    <form id="lf">
      <label>Username<input id="lu" autocomplete="username" autocapitalize="none" required></label>
      <label>Password<input id="lp" type="password" autocomplete="current-password" required></label>
      <button class="pri" style="width:100%" type="submit">Log in</button>
    </form>
    <form id="sg" class="hide">
      <label>Shop name<input id="gn" required></label>
      <label>Choose a username<input id="gu" autocapitalize="none" required></label>
      <label>Password (6+ characters)<input id="gp" type="password" minlength="6" autocomplete="new-password" required></label>
      <label class="chk"><input id="ga" type="checkbox" required><span> please keep your password remembered. </span></label>
      <button class="pri" style="width:100%" type="submit">Create shop</button>
    </form>
    <div class="msg" id="am" role="alert"></div>
  </div>
  <div id="in" class="hide">
    <div class="who"><span id="who"></span><button id="out" type="button">Log out</button></div>
    <div id="app" class="hide">
      <div class="sum" id="sum"></div>
      <div class="bar">
        <input id="q" type="search" placeholder="Search name, brand or lot no." aria-label="Search">
        <select id="f" aria-label="Filter" style="max-width:150px"><option value="all">All</option><option value="exp">Expired</option><option value="soon">Expiring soon</option></select>
      </div>
      <div id="list"></div>
      <div class="box hide" id="staff">
        <b>Staff logins for your shop</b>
        <form id="sf" style="margin-top:10px">
          <div class="r2"><label>New username<input id="su" autocapitalize="none" required></label>
          <label>Password (6+ characters)<input id="sp" type="text" minlength="6" required></label></div>
          <label>Role<select id="sr"><option value="staff">Staff (cannot delete stock)</option><option value="admin">Admin (full access)</option></select></label>
          <button class="pri" type="submit">Create login</button>
        </form>
        <div id="ulist" style="margin-top:10px"></div>
        <b style="display:block;margin-top:14px">Recent activity</b><div id="log">No activity yet.</div>
        <div class="msg" id="sm" role="status"></div>
      </div>
    </div>
    <div id="owner" class="hide">
      <div class="sum" id="osum"></div>
      <input id="oq" type="search" placeholder="Search product, brand or shop" aria-label="Search" style="margin-bottom:12px">
      <div id="ogroups"></div>
      <div class="note">Cost prices are private to each shop and are not shown here.</div>
    </div>
  </div>
  <p class="note"> please keep your password remembered. </p>
</main>
<button class="pri fab hide" id="add" type="button">Add stock</button>
<dialog id="dlg"><form id="frm" method="dialog">
  <b id="dt" style="font-size:18px">Add stock</b>
  <label>Common name<input id="common" required placeholder="e.g. Urea"></label>
  <label>Technical name<input id="tech"></label>
  <label>Brand name<input id="brand"></label>
  <div class="r2">
    <label>Lot / batch no.<input id="lot" required></label>
    <label>Supplier<input id="sup"></label>
    <label>Date of purchase<input id="bought" type="date" required></label>
    <label>Expiry date<input id="exp" type="date" required></label>
    <label>Pack size<input id="ps" type="number" min="0" step="any" required></label>
    <label>Pack unit<select id="pu"><option value="L">Litre (L)</option><option value="ml">Millilitre (ml)</option><option value="kg">Kilogram (kg)</option><option value="g">Gram (g)</option></select></label>
    <label>Number of packs<input id="packs" type="number" min="0" step="any" required></label><span></span>
    <label>Cost per pack<input id="cost" type="number" min="0" step="any" required></label>
    <label>Selling price per pack<input id="sell" type="number" min="0" step="any" required></label>
  </div>
  <div class="tot" id="ftot"></div>
  <div class="act"><button type="button" id="cx">Cancel</button><button class="pri" type="submit">Save</button></div>
</form></dialog>
<dialog id="sdlg"><form id="sfrm" method="dialog">
  <b id="st" style="font-size:18px">Sell</b>
  <label>Packs sold<input id="sq" type="number" min="0" step="any" required></label>
  <div class="act"><button type="button" id="scx">Cancel</button><button class="pri" type="submit">Reduce stock</button></div>
</form></dialog>
<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,addDoc,query,orderBy,limit,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=i=>document.getElementById(i);
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const mail=u=>u.trim().toLowerCase().replace(/[^a-z0-9._-]/g,"")+"@shopstock.app";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let me=null,items=[],costs={},users=[],unsubs=[],editId=null,sellId=null,delArm=null,secAuth=null,signingUp=false,shops={},ostock={},limits={},subbed={};
let pref={cur:"₹",warn:60};try{Object.assign(pref,JSON.parse(localStorage.getItem("ss-pref")))}catch(e){}
const money=n=>pref.cur+(Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
const num=n=>(Math.round(n*1000)/1000).toLocaleString(undefined,{maximumFractionDigits:3});
const days=v=>{const p=v.split("-"),d=new Date(p[0],p[1]-1,p[2]),t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)};
const fmt=v=>{if(!v)return"–";const p=v.split("-");return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})};
const st=it=>{const d=days(it.exp);return d<0?"exp":d<=pref.warn?"soon":"ok"};
const lab=it=>{const d=days(it.exp);return d<0?`Expired ${-d}d ago`:d===0?"Expires today":`${d} days left`};
const F={L:1,ml:.001,kg:1,g:.001},base=u=>u==="L"||u==="ml"?"L":"kg",total=it=>it.packs*it.ps*F[it.pu];
const cost=it=>costs[it.id]||0;
const addLog=t=>{try{addDoc(collection(db,"shops",me.shopId,"log"),{by:me.username,at:Date.now(),text:t})}catch(e){}};

function render(){
  let c=0,sell=0,soon=0,exp=0,loss=0,L=0,kg=0;
  items.forEach(it=>{const s=st(it);
    if(s==="exp"){exp++;loss+=it.packs*cost(it)}else{c+=it.packs*cost(it);sell+=it.packs*it.sell;base(it.pu)==="L"?L+=total(it):kg+=total(it)}
    if(s==="soon")soon++});
  $("sum").innerHTML=`<div class="s"><b>${money(c)}</b><span>Stock value (cost)</span></div><div class="s"><b>${money(sell-c)}</b><span>Expected profit</span></div>
  <div class="s"><b>${num(L)} L</b><span>Liquid in stock</span></div><div class="s"><b>${num(kg)} kg</b><span>Solid in stock</span></div>
  <div class="s ${soon?"warn":""}"><b>${soon}</b><span>Expiring within ${pref.warn} days</span></div><div class="s ${exp?"bad":""}"><b>${exp?money(loss):0}</b><span>Expired loss (${exp} lots)</span></div>`;
  const q=$("q").value.trim().toLowerCase(),f=$("f").value,adm=me&&me.role==="admin";
  const rows=items.filter(it=>(!q||[it.common,it.tech,it.brand,it.lot].join(" ").toLowerCase().includes(q))&&(f==="all"||st(it)===f)).sort((a,b)=>a.exp<b.exp?-1:a.exp>b.exp?1:0);
  $("list").innerHTML=rows.length?rows.map(it=>`<div class="item ${st(it)}" data-id="${it.id}"><div class="top"><div><div class="nm">${esc(it.common)}</div><div class="sb">${[it.tech,it.brand].filter(Boolean).map(esc).join(" · ")||"No technical or brand name"}</div></div><span class="tag">${lab(it)}</span></div>
  <div class="g"><span>Lot <b>${esc(it.lot)}</b></span><span>Expiry <b>${fmt(it.exp)}</b></span><span>Bought <b>${fmt(it.bought)}</b></span><span>Supplier <b>${esc(it.sup||"–")}</b></span>
  <span class="w">Packing <b>${num(it.ps)} ${esc(it.pu)} × ${num(it.packs)} packs = ${num(total(it))} ${base(it.pu)}</b></span><span>Cost / pack <b>${money(cost(it))}</b></span><span>Selling / pack <b>${money(it.sell)}</b></span></div>
  <div class="act"><button data-a="sell" type="button">Sell</button><button data-a="edit" type="button">Edit</button>${adm?`<button data-a="del" type="button">${delArm===it.id?"Tap again to delete":"Delete"}</button>`:""}</div></div>`).join(""):`<div class="empty">${items.length?"No lots match.":"No stock yet. Tap “Add stock” to enter your first lot."}</div>`;
}
function renderUsers(){$("ulist").innerHTML=users.map(u=>`<div class="u"><span>${esc(u.username)} · ${u.role}${u.active?"":" · disabled"}</span>${u.id===me.uid?"":`<button data-u="${u.id}" data-on="${u.active?0:1}" type="button">${u.active?"Disable":"Enable"}</button>`}</div>`).join("")}

const ppu=r=>r.sell/((r.ps*F[r.pu])||1),lim=k=>limits[k]&&limits[k].max;
function renderOwner(){
  const q=$("oq").value.trim().toLowerCase(),g={};let lots=0,expd=0;
  Object.keys(ostock).forEach(sid=>ostock[sid].forEach(it=>{lots++;if(st(it)==="exp")expd++;const k=it.common.trim().toLowerCase();(g[k]=g[k]||[]).push({...it,shop:(shops[sid]||{}).name||sid})}));
  const over=k=>g[k].filter(r=>lim(k)&&ppu(r)>lim(k)).length;
  const keys=Object.keys(g).filter(k=>!q||k.includes(q)||g[k].some(r=>(r.shop+" "+(r.brand||"")).toLowerCase().includes(q))).sort((a,b)=>over(b)-over(a)||a.localeCompare(b));
  const flagged=Object.keys(g).reduce((a,k)=>a+over(k),0);
  $("osum").innerHTML=`<div class="s"><b>${Object.keys(shops).length}</b><span>Shops</span></div><div class="s"><b>${lots}</b><span>Stock lots</span></div><div class="s ${flagged?"bad":""}"><b>${flagged}</b><span>Prices above limit</span></div><div class="s ${expd?"warn":""}"><b>${expd}</b><span>Expired lots</span></div>`;
  $("ogroups").innerHTML=keys.length?keys.map(k=>{const rs=g[k].slice().sort((a,b)=>ppu(b)-ppu(a)),n=over(k);
    return`<div class="item ${n?"exp":""}"><div class="top"><div class="nm">${esc(rs[0].common)}</div><label class="lim" style="margin:0">Max per ${base(rs[0].pu)}<input data-k="${esc(k)}" type="number" min="0" step="any" value="${lim(k)||""}" aria-label="Maximum price per unit"></label></div>`+
    rs.map(r=>`<div class="u" style="display:block"><b>${esc(r.shop)}</b> · ${esc(r.brand||"–")} · lot ${esc(r.lot)}<br><span class="sb">${money(r.sell)} per ${num(r.ps)} ${esc(r.pu)} pack · ${money(ppu(r))} per ${base(r.pu)}${lim(k)&&ppu(r)>lim(k)?" · above limit":""}</span></div>`).join("")+`</div>`}).join(""):`<div class="empty">No stock from any shop yet.</div>`;
}
$("oq").oninput=renderOwner;
$("ogroups").onchange=async e=>{const i=e.target.closest("input[data-k]");if(!i)return;const k=i.dataset.k;
  try{i.value===""?await deleteDoc(doc(db,"limits",k)):await setDoc(doc(db,"limits",k),{max:+i.value||0})}catch(x){alert("Couldn’t save limit: "+x.message)}};
function startOwner(){
  unsubs.push(onSnapshot(collection(db,"limits"),s=>{limits={};s.docs.forEach(d=>limits[d.id]=d.data());renderOwner()}));
  unsubs.push(onSnapshot(collection(db,"shops"),s=>{s.docs.forEach(d=>{shops[d.id]=d.data();
    if(!subbed[d.id]){subbed[d.id]=1;unsubs.push(onSnapshot(collection(db,"shops",d.id,"stock"),ss=>{ostock[d.id]=ss.docs.map(x=>({...x.data(),id:x.id}));renderOwner()}))}});renderOwner()}));
}

const ftot=()=>{$("ftot").textContent="Total quantity: "+num((+$("ps").value||0)*(+$("packs").value||0)*F[$("pu").value])+" "+base($("pu").value)};
["ps","packs","pu"].forEach(i=>$(i).addEventListener("input",ftot));
const FIELDS=["common","tech","brand","lot","sup","bought","exp","ps","packs","sell"];
function openForm(it){editId=it?it.id:null;$("dt").textContent=it?"Edit stock":"Add stock";
  FIELDS.concat("cost").forEach(k=>$(k).value="");if(it){FIELDS.forEach(k=>$(k).value=it[k]!=null?it[k]:"");$("cost").value=cost(it)}
  $("pu").value=it?it.pu:"L";if(!it)$("bought").value=new Date().toISOString().slice(0,10);ftot();$("dlg").showModal()}
$("add").onclick=()=>openForm(null);$("cx").onclick=()=>$("dlg").close();$("scx").onclick=()=>$("sdlg").close();
$("frm").onsubmit=async()=>{
  const o={};FIELDS.forEach(k=>o[k]=$(k).value.trim());["ps","packs","sell"].forEach(k=>o[k]=parseFloat(o[k])||0);o.pu=$("pu").value;
  const id=editId||nid(),sid=me.shopId;
  try{await setDoc(doc(db,"shops",sid,"stock",id),o);await setDoc(doc(db,"shops",sid,"private",id),{cost:parseFloat($("cost").value)||0});addLog((editId?"edited ":"added ")+o.common+" (lot "+o.lot+")")}catch(e){alert("Couldn’t save: "+e.message)}};
$("sfrm").onsubmit=async()=>{const it=items.find(x=>x.id===sellId);if(!it)return;
  try{const n=+$("sq").value||0;await updateDoc(doc(db,"shops",me.shopId,"stock",sellId),{packs:Math.max(0,Math.round((it.packs-n)*1000)/1000)});addLog("sold "+num(n)+" packs of "+it.common+" (lot "+it.lot+")")}catch(e){alert("Couldn’t update: "+e.message)}};
$("list").onclick=async e=>{const b=e.target.closest("button");if(!b)return;
  const id=b.closest(".item").dataset.id,it=items.find(x=>x.id===id);
  if(b.dataset.a==="edit")openForm(it);
  else if(b.dataset.a==="sell"){sellId=id;$("st").textContent=`Sell: ${it.common} (Lot ${it.lot})`;$("sq").value="";$("sq").max=it.packs;$("sdlg").showModal()}
  else if(b.dataset.a==="del"){if(delArm===id){delArm=null;try{await deleteDoc(doc(db,"shops",me.shopId,"stock",id));await deleteDoc(doc(db,"shops",me.shopId,"private",id));addLog("deleted "+it.common+" (lot "+it.lot+")")}catch(x){alert("Couldn’t delete: "+x.message)}}else{delArm=id;render()}}};
$("q").oninput=render;$("f").onchange=render;

$("t1").onclick=()=>{$("lf").classList.remove("hide");$("sg").classList.add("hide");$("t1").classList.add("on");$("t2").classList.remove("on");$("am").textContent=""};
$("t2").onclick=()=>{$("sg").classList.remove("hide");$("lf").classList.add("hide");$("t2").classList.add("on");$("t1").classList.remove("on");$("am").textContent=""};
$("lf").onsubmit=async e=>{e.preventDefault();$("am").textContent="";
  try{await signInWithEmailAndPassword(auth,mail($("lu").value),$("lp").value)}catch(x){$("am").textContent="Wrong username or password, or no internet connection."}};
$("sg").onsubmit=async e=>{e.preventDefault();$("am").textContent="";signingUp=true;
  try{const u=$("gu").value.trim().toLowerCase(),sid=nid();
    const c=await createUserWithEmailAndPassword(auth,mail(u),$("gp").value);
    await setDoc(doc(db,"shops",sid),{name:$("gn").value.trim(),ownerUid:c.user.uid,createdAt:Date.now(),agreedNotice:true});
    await setDoc(doc(db,"users",c.user.uid),{username:u,role:"admin",shopId:sid,active:true});
    signingUp=false;await boot(auth.currentUser);
  }catch(x){signingUp=false;$("am").textContent=x.code==="auth/email-already-in-use"?"That username is taken. Try another.":"Couldn’t create the shop: "+x.message}};
$("out").onclick=()=>signOut(auth);
$("sf").onsubmit=async e=>{e.preventDefault();const u=$("su").value.trim().toLowerCase();$("sm").textContent="";
  try{
    if(!secAuth)secAuth=getAuth(initializeApp(firebaseConfig,"secondary"));
    const c=await createUserWithEmailAndPassword(secAuth,mail(u),$("sp").value);await signOut(secAuth);
    await setDoc(doc(db,"users",c.user.uid),{username:u,role:$("sr").value,shopId:me.shopId,active:true});
    $("sf").reset();$("sm").style.color="var(--green)";$("sm").textContent="Login created for "+u+".";
  }catch(x){$("sm").style.color="var(--red)";$("sm").textContent=x.code==="auth/email-already-in-use"?"That username is taken.":"Couldn’t create login: "+x.message}};
$("ulist").onclick=async e=>{const b=e.target.closest("button");if(!b)return;
  try{await updateDoc(doc(db,"users",b.dataset.u),{active:b.dataset.on==="1"})}catch(x){alert(x.message)}};

async function boot(u){
  unsubs.forEach(f=>f());unsubs=[];me=null;items=[];costs={};shops={};ostock={};subbed={};
  if(!u){$("in").classList.add("hide");$("auth").classList.remove("hide");$("add").classList.add("hide");return}
  let p=null;try{const s=await getDoc(doc(db,"users",u.uid));p=s.exists()?s.data():null}catch(e){}
  if(!p||!p.active){await signOut(auth);$("am").textContent="This login is disabled or not set up. Ask your shop admin.";return}
  me={...p,uid:u.uid};$("auth").classList.add("hide");$("in").classList.remove("hide");
  $("who").textContent=`Logged in as ${p.username} (${p.role==="owner"?"app owner":p.role})`;
  if(p.role==="owner"){$("app").classList.add("hide");$("add").classList.add("hide");$("owner").classList.remove("hide");startOwner();return}
  $("owner").classList.add("hide");$("app").classList.remove("hide");$("add").classList.remove("hide");
  const sid=p.shopId,adm=p.role==="admin";$("staff").classList.toggle("hide",!adm);
  try{const s=await getDoc(doc(db,"shops",sid));if(s.exists())$("who").textContent+=" · "+s.data().name}catch(e){}
  unsubs.push(onSnapshot(collection(db,"shops",sid,"stock"),s=>{items=s.docs.map(d=>({...d.data(),id:d.id}));render()},e=>alert("Cloud error: "+e.message)));
  unsubs.push(onSnapshot(collection(db,"shops",sid,"private"),s=>{costs={};s.docs.forEach(d=>costs[d.id]=d.data().cost||0);render()}));
  if(adm){
    unsubs.push(onSnapshot(query(collection(db,"users"),where("shopId","==",sid)),s=>{users=s.docs.map(d=>({...d.data(),id:d.id}));renderUsers()}));
    unsubs.push(onSnapshot(query(collection(db,"shops",sid,"log"),orderBy("at","desc"),limit(30)),s=>{$("log").innerHTML=s.docs.length?s.docs.map(d=>{const l=d.data();return`<div class="u"><span>${esc(l.by)} ${esc(l.text)}</span><span style="color:var(--muted);font-size:13px">${new Date(l.at).toLocaleString(undefined,{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}</span></div>`}).join(""):"No activity yet."}));
  }
  render();
}
onAuthStateChanged(auth,u=>{if(!signingUp)boot(u)});
</script>
</body>
</html>

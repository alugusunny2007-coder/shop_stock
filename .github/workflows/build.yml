name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          mkdir www
          cp index.html firebase-config.js manifest.json icon-192.png icon-512.png www/
          npm install
          npx cap add android
          npx cap sync android
          for f in $(find android/app/src/main/res -name 'ic_launcher*.png'); do
            sz=$(identify -format '%wx%h' "$f" 2>/dev/null) && convert icon-512.png -resize "${sz}!" "$f" || true
          done
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shop-stock-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
